<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mood Garden</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{--bg:#FFF9F0;--sf:#fff;--ink:#1E1E1E;--pk:#F7A8B8;--gr:#BFD8BD;--yl:#FFE5A3;--lv:#DCD0FF;--bl:#C8E3F5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a2530;--sf:#3a3442;--ink:#f5efe6}}
:root[data-theme=dark]{--bg:#2a2530;--sf:#3a3442;--ink:#f5efe6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
h1,h2,h3,.f{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
#app{display:flex;min-height:100vh}
nav{width:220px;padding:16px;border-right:2px solid var(--ink);background:var(--sf);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav a{padding:9px 12px;border:2px solid transparent;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600}
nav a.on{background:var(--pk);border-color:#1E1E1E;box-shadow:3px 3px 0 #1E1E1E;color:#1E1E1E}
main{flex:1;padding:20px;max-width:1000px;min-width:0}
.card,.btn,input,select,textarea{border:2px solid #1E1E1E;border-radius:14px;background:var(--sf);color:var(--ink);font:inherit}
.card{padding:14px;box-shadow:6px 6px 0 #1E1E1E;margin-bottom:16px}
.btn{padding:8px 14px;font-weight:700;cursor:pointer;background:var(--yl);color:#1E1E1E;box-shadow:4px 4px 0 #1E1E1E;transition:.08s}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #1E1E1E}
.btn.p{background:var(--pk)}.btn.s{padding:4px 9px;box-shadow:2px 2px 0 #1E1E1E;font-size:13px}
input,select,textarea{padding:8px;width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input,.row>select{width:auto;flex:1;min-width:110px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#gd{position:relative;height:60vh;min-height:340px;border:2px solid #1E1E1E;border-radius:18px;box-shadow:6px 6px 0 #1E1E1E;background:linear-gradient(#C8E3F5 0 30%,#BFD8BD 30%);overflow:hidden;cursor:crosshair}
#gd.n{background:linear-gradient(#3b3a66 0 30%,#5b7a62 30%)}
.cat{position:absolute;transform:translate(-50%,-50%);font-size:34px;cursor:pointer;animation:pop .4s;border:0;background:none;padding:0}.cat:hover{transform:translate(-50%,-60%) scale(1.15)}
.dec{position:absolute;font-size:30px;pointer-events:none}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{max-width:460px;width:100%;max-height:90vh;overflow:auto;margin:0}
.mp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.mp button{border:2px solid #1E1E1E;border-radius:12px;padding:6px 2px;cursor:pointer;color:#1E1E1E;font-size:12px;font-weight:700}.mp button b{display:block;font-size:26px}.mp .sel{box-shadow:3px 3px 0 #1E1E1E;transform:translate(-2px,-2px)}
#t{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px}
.ts{background:var(--lv);color:#1E1E1E;border:2px solid #1E1E1E;box-shadow:4px 4px 0 #1E1E1E;padding:8px 14px;border-radius:12px;font-weight:700;animation:pop2 .3s}@keyframes pop2{from{opacity:0;transform:translateY(12px)}}
.bar{height:12px;border:2px solid #1E1E1E;border-radius:8px;background:var(--sf);overflow:hidden}.bar i{display:block;height:100%;background:var(--gr)}
.dn{width:140px;height:140px;border-radius:50%;border:2px solid #1E1E1E}.pill{padding:2px 8px;border:2px solid #1E1E1E;border-radius:99px;font-size:12px;font-weight:700;color:#1E1E1E}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal i{aspect-ratio:1;border:2px solid #1E1E1E;border-radius:8px;display:flex;align-items:center;justify-content:center;font-style:normal}
.mut{opacity:.7;font-size:13px}.lock{filter:grayscale(1);opacity:.6}
@media(max-width:760px){#app{flex-direction:column}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;z-index:8;border-right:0;border-top:2px solid #1E1E1E;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}nav a{white-space:nowrap;padding:8px}nav .x{display:none}main{padding:12px 12px 90px}}
:root{--ink:#3D3447;--ln:#4A3F55}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ln:#8d7fa0}}:root[data-theme=dark]{--ln:#8d7fa0}
body{line-height:1.6}main p{max-width:62ch}
.card,.btn,input,select,textarea,#gd,.bar,.dn,.pill,.cal i,.mp button,.ts,nav,nav a.on{border-color:var(--ln)}
.card,.btn{border-radius:18px}.card,#gd{box-shadow:5px 5px 0 #4A3F5533}.btn{box-shadow:3px 3px 0 var(--ln);min-height:44px}.btn.s{min-height:38px}
nav a.on{box-shadow:3px 3px 0 var(--ln)}
:focus-visible{outline:3px solid #7C5CBF;outline-offset:2px}
#gd{background:radial-gradient(ellipse 60% 22% at 25% 34%,#A9CDA7 98%,#0000),radial-gradient(ellipse 70% 25% at 80% 36%,#9CC49A 98%,#0000),linear-gradient(#CFE8F7 0 30%,#BFD8BD 30%)}
#gd.n{background:radial-gradient(ellipse 60% 22% at 25% 34%,#5f8566 98%,#0000),linear-gradient(#35345f 0 30%,#4e7058 30%)}
.sun{position:absolute;right:8%;top:5%;width:54px;height:54px;border-radius:50%;background:var(--yl);box-shadow:0 0 0 10px #ffe5a366;pointer-events:none}
.cl{position:absolute;top:8%;left:-15%;width:90px;height:28px;background:#fff;border-radius:99px;opacity:.85;animation:dr 60s linear infinite;pointer-events:none}.c2{top:17%;width:64px;animation-duration:85s;animation-delay:-30s}@keyframes dr{to{left:110%}}
.cat{animation:pop .4s,bt 4.5s ease-in-out .4s infinite}.cat:hover{animation-play-state:paused}@keyframes bt{50%{transform:translate(-50%,-53%) scale(1.05)}}
.br{display:flex;gap:14px;align-items:center;background:var(--bl);color:#3D3447;margin-top:14px}.bc{width:56px;height:56px;flex:none;border-radius:50%;background:#fff;border:2px solid var(--ln);animation:bz 10s ease-in-out infinite}@keyframes bz{0%,100%{transform:scale(.6)}40%{transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#gd{cursor:default}.gg{position:absolute;left:3%;right:3%;top:36%;bottom:3%;display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));grid-auto-rows:56px;align-content:start;overflow:auto}
.pl{border:0;background:radial-gradient(ellipse 60% 25% at 50% 85%,#4a3f5522,#0000);font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:14px;animation:pp .4s,bt2 4.5s ease-in-out .4s infinite}.pl:hover{animation-play-state:paused;transform:scale(1.15)}
.pl.e{border:2px dashed var(--ln);background:none;opacity:.45;font-size:20px;animation:none;color:var(--ink)}.pl.e:hover{opacity:1;background:#fff8;transform:none}
@keyframes pp{from{transform:scale(0)}}@keyframes bt2{50%{transform:scale(1.06)}}
#gd{height:68vh;min-height:440px}
.gg{top:30%;bottom:9%;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(64px,96px);align-content:space-evenly;justify-items:center;overflow:hidden auto}
.pl{width:min(64px,100%);height:64px}
@media(max-width:520px){.gg{grid-template-columns:repeat(4,1fr)}}
#gd::before{content:'🌿  🌼  🌿  🌱  🌿  🌼  🌿  🌱  🌿  🌼  🌿';position:absolute;bottom:4px;left:0;right:0;text-align:center;letter-spacing:.7em;font-size:20px;opacity:.75;white-space:nowrap;overflow:hidden;pointer-events:none}
#gd::after{content:'🕊️';position:absolute;top:12%;left:28%;font-size:22px;animation:fl 16s ease-in-out infinite alternate;pointer-events:none}@keyframes fl{to{transform:translate(160px,16px)}}
</style></head><body><div id="app"><nav id="nv"></nav><main id="mn"></main></div><div id="ov"></div><div id="t"></div>
<script>
const M={happy:['😸','Happy','#FFE5A3','Sunny and light',5],sad:['😿','Sad','#C8E3F5','Heavy heart',1],angry:['😡','Angry','#F7A8B8','Fired up',1],tired:['😴','Tired','#DCD0FF','Low battery',2],anxious:['😰','Anxious','#FFE5A3','Buzzing inside',2],calm:['😌','Calm','#BFD8BD','Peaceful',4],excited:['🤩','Excited','#F7A8B8','Sparkling',5],lonely:['🥺','Lonely','#C8E3F5','Missing someone',2]};
const MK=Object.keys(M),D=864e5,K='mg-proto';
const R={paw:'🐾 Support',hug:'🫂 Hug',grow:'🌱 Grow',love:'💗 Love'};
const IT=[['🌻','Sunflower','cats',1],['☁️','Cloud','cats',0],['🌷','Tulips','cats',3],['🦋','Butterflies','cats',5],['🌈','Rainbow','streak',3],['🌳','Tree','cats',10],['🐈','Cat companion','streak',7]];
const KIND=['Naming a feeling helps it settle 💗','All feelings are welcome here 🌿','Thank you for noticing. That takes care.'];const PR=['What made you smile today?','What challenged you today?','What are you grateful for?','What would you tell yourself right now?'];
const NOTES=['Finished my project!','Long day, need rest.','Walked with friends.','Too many deadlines.','Quiet evening.','Missing home.'];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S){const n=Date.now();S={u:{name:'Alex',av:'🐱',join:'Sep 2026'},cats:Array.from({length:14},(_,i)=>({id:i+1,m:MK[(i*3)%8],x:.1+((i*37)%80)/100,y:.35+((i*23)%55)/100,note:NOTES[i%6],t:n-Math.floor(i/1.5)*D})),refl:[],mine:{},eq:['🌻','☁️'],night:0,rem:1,seen:[],nid:99,
posts:[[1,'MochiMuse','😺','calm',4,'Slow morning, warm tea. Grateful for small things.',2],[2,'Nimbus','🐱','anxious',2,'Big exam tomorrow. Deep breaths, everyone.',5],[3,'Sprout','😻','excited',5,'Got my first plant to bloom! 🌱',1],[4,'Pebble','🙀','lonely',2,'Moved to a new city. Hello, anyone?',8]].map(p=>({id:p[0],u:p[1],av:p[2],m:p[3],p:p[4],tx:p[5],t:Date.now()-p[6]*36e5,c:{paw:3+p[0],hug:p[0]*2,grow:1,love:p[0]+2}}))}}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=t=>new Date(t).toDateString(),fd=t=>new Date(t).toLocaleString('en',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function streak(){const s=new Set(S.cats.map(c=>dk(c.t)));let d=Date.now(),n=0,g=1;if(!s.has(dk(d)))d-=D;while(1){if(s.has(dk(d)))n++;else if(g&&s.has(dk(d-D)))g=0;else break;d-=D}return n}
const topM=l=>{const c={};l.forEach(x=>c[x.m]=(c[x.m]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]}
function ach(){const c=S.cats.length,st=streak(),dn=S.cats.filter(x=>x.note).length,mo=new Set(S.cats.map(x=>x.m)).size;
return[['First Plant','Plant your first mood cat',c,1],['Growing Garden','Plant 10 mood cats',c,10],['Flourishing Garden','Plant 50 mood cats',c,50],['Little Sprout','Check in 3 days in a row',st,3],['Blooming','Reach a 7-day streak',st,7],['Flourishing','Reach a 30-day streak',st,30],['First Words','Write your first diary note',dn,1],['Storyteller','Write 10 diary notes',dn,10],['Mood Explorer','Experience all 8 moods',mo,8]]}
function chk(){const a=ach().filter(x=>x[2]>=x[3]).map(x=>x[0]);a.filter(n=>!S.seen.includes(n)).forEach(n=>toast('🏆 Unlocked: '+n,'ach'));S.seen=a;sv()}
function toast(m,go){const e=document.createElement('div');e.className='ts';e.textContent=m;if(go){e.style.cursor='pointer';e.onclick=()=>location.hash=go}$('#t').append(e);setTimeout(()=>e.remove(),3500)}
const ov=h=>{$('#ov').innerHTML=h?`<div class="ov" data-a="bg"><div class="card md">${h}</div></div>`:''};
const mood=k=>`<span class="pill" style="background:${M[k][2]}">${M[k][0]} ${M[k][1]}</span>`;
let sel,pos,q='',fm='',so='new',rg=30,wf='recent',hl=null;
const A={
bg(d,e){if(e.target.dataset.a=='bg')ov('')},x(){ov('')},
garden(d,e){if(e.target.closest('[data-a=cat]'))return;const r=$('#gd').getBoundingClientRect();A.plant({x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})},
plant(p){pos=p;sel=null;ov(`<h2>Plant a Mood 🌱</h2><div class="mp">${MK.map(k=>`<button data-a="pk" data-k="${k}" style="background:${M[k][2]}"><b>${M[k][0]}</b>${M[k][1]}<br><span class="mut" style="font-weight:400">${M[k][3]}</span></button>`).join('')}</div><textarea id="nt" rows="3" placeholder="Optional note…"></textarea><div class="row" style="margin-top:10px"><button class="btn p" data-a="ok">Plant Cat</button><button class="btn" data-a="x">Cancel</button></div>`)},
pk(d){sel=d.k;document.querySelectorAll('.mp button').forEach(b=>b.classList.toggle('sel',b.dataset.k==sel))},
ok(){if(!sel)return toast('Pick a mood first');S.cats.push({id:++S.nid,m:sel,x:pos.x,y:pos.y,note:$('#nt').value.trim(),t:Date.now()});ov('');sv();toast(M[sel][0]+' planted! '+(M[sel][4]<3?KIND[Math.random()*3|0]:'🌷'));chk();R_();setTimeout(R_,3100)},
cat(d){const c=S.cats.find(x=>x.id==d.id);ov(`<h2>${M[c.m][0]} ${M[c.m][1]}</h2><p class="mut">Planted ${fd(c.t)}</p><p>${esc(c.note)||'<i>No note</i>'}</p><div class="row"><button class="btn s" data-a="ed" data-id="${c.id}">Edit</button><button class="btn s" data-a="del" data-id="${c.id}">Delete</button><button class="btn s" data-a="dia" data-id="${c.id}">Open in diary</button><button class="btn s" data-a="x">Close</button></div>`)},
dia(d){hl=+d.id;q='';fm='';ov('');location.hash='diary'},
ed(d){const c=S.cats.find(x=>x.id==d.id);ov(`<h2>Edit entry</h2><div class="mp">${MK.map(k=>`<button data-a="pk" data-k="${k}" style="background:${M[k][2]}" class="${k==c.m?'sel':''}"><b>${M[k][0]}</b>${M[k][1]}</button>`).join('')}</div><textarea id="nt" rows="3">${esc(c.note)}</textarea><div class="row" style="margin-top:10px"><button class="btn p" data-a="sed" data-id="${c.id}">Save</button><button class="btn" data-a="x">Cancel</button></div>`);sel=c.m},
sed(d){const c=S.cats.find(x=>x.id==d.id);c.m=sel;c.note=$('#nt').value.trim();sv();ov('');toast('Entry updated');chk();R_()},
del(d){ov(`<h2>Delete this entry?</h2><p>This removes the cat from your garden and diary.</p><div class="row"><button class="btn p" data-a="yd" data-id="${d.id}">Delete</button><button class="btn" data-a="x">Keep</button></div>`)},
yd(d){S.cats=S.cats.filter(x=>x.id!=d.id);sv();ov('');toast('Entry deleted');R_()},
rng(d){rg=+d.v;R_()},stat(d){fm=d.m;q='';location.hash='diary'},
react(d){const m=S.mine[d.id],p=S.posts.find(x=>x.id==d.id);if(m){p.c[m]--;delete S.mine[d.id]}if(m!=d.k){p.c[d.k]++;S.mine[d.id]=d.k}sv();R_()},
rep(){toast('Reported. Thanks for keeping the wall kind 💗')},
post(){const t=$('#pt').value.trim();if(!t)return toast('Write something first');S.posts.unshift({id:++S.nid,u:S.u.name,av:S.u.av,m:$('#pm').value,p:+$('#pp').value,tx:t,t:Date.now(),c:{paw:0,hug:0,grow:0,love:0}});sv();toast('Posted to the wall');R_()},
wf(d){wf=d.v;R_()},
eq(d){const i=IT.find(x=>x[0]==d.e),v=i[2]=='cats'?S.cats.length:streak();if(v<i[3])return toast('Locked: '+i[3]+' '+(i[2]=='cats'?'cats':'day streak')+' needed');S.eq=S.eq.includes(d.e)?S.eq.filter(x=>x!=d.e):[...S.eq,d.e];sv();R_()},
refl(){const t=$('#rt').value.trim();if(!t)return toast('Write a reflection first');S.refl.unshift({p:$('#rp').value,tx:t,t:Date.now()});sv();toast('Reflection saved');R_()},
name(){S.u.name=$('#un').value.trim()||'Alex';S.u.av=$('#ua').value;sv();toast('Profile saved');R_()},
night(){S.night=!S.night;sv();R_()},rem(){S.rem=!S.rem;sv();R_()},
acc(){ov(`<h2>Delete account?</h2><p>This clears all prototype data on this device.</p><div class="row"><button class="btn p" data-a="wipe">Delete</button><button class="btn" data-a="x">Cancel</button></div>`)},
wipe(){try{localStorage.removeItem(K)}catch(e){}location.reload()},out(){toast('Logged out (prototype)—welcome back, '+S.u.name)},
ach(d){const a=ach()[d.i];ov(`<h2>${a[2]>=a[3]?'🏆':'🔒'} ${a[0]}</h2><p>${a[1]}</p><div class="bar"><i style="width:${Math.min(100,a[2]/a[3]*100)}%"></i></div><p class="mut">${Math.min(a[2],a[3])}/${a[3]}</p><button class="btn" data-a="x">Close</button>`)}};
const bar=(v,g)=>`<div class="bar"><i style="width:${Math.min(100,v/g*100)}%"></i></div>`;
const V={
home(){const s=streak(),t=topM(S.cats),h=new Date().getHours();return`<h1>Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${esc(S.u.name)}! 🌷</h1><p class="mut">${new Date().toDateString()} · Your garden is growing beautifully.</p><div class="row" style="margin:10px 0"><span class="pill" style="background:var(--gr)">🐱 ${S.cats.length} cats</span><span class="pill" style="background:var(--yl)">🌿 ${s} days tended</span><span class="pill" style="background:var(--pk)">Top mood: ${t?M[t][0]+' '+M[t][1]:'–'}</span><button class="btn p s" data-a="plant" data-x=".5" data-y=".6">+ Plant a Mood</button></div><div id="gd" class="${S.night?'n':''}"><span class="sun"></span><span class="cl"></span><span class="cl c2"></span>${S.eq.map((e,i)=>`<span class="dec" style="left:${8+i*13}%;top:${e=='🌳'?'24':i%2?'6':'16'}%">${e}</span>`).join('')}<div class="gg">${S.cats.slice().sort((a,b)=>a.t-b.t).map(c=>`<button class="pl" data-a="cat" data-id="${c.id}" title="${M[c.m][1]}">${Date.now()-c.t<3000?'🌱':M[c.m][0]}</button>`).join('')}${'x'.repeat(6).split('').map(()=>`<button class="pl e" data-a="plant" data-x="0" data-y="0" aria-label="Plant here">+</button>`).join('')}</div></div><p class="mut">Tap an empty plot to plant. Cats grow in order, like a forest.</p><div class="card br"><div class="bc"></div><div><h3>Take a slow breath</h3><p class="mut">In for 4, out for 6. Longer exhales help the body settle.</p></div></div><div class="row">${MK.map(mood).join('')}</div>`},
diary(){let l=S.cats.filter(c=>(!fm||c.m==fm)&&(!q||c.note.toLowerCase().includes(q.toLowerCase())||M[c.m][1].toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>so=='new'?b.t-a.t:a.t-b.t);
return`<h1>My Diary 📖</h1><p class="mut">${S.cats.length} entries · private to you.</p><div class="row" style="margin:10px 0"><input id="q" placeholder="Search…" value="${esc(q)}"><select id="fm"><option value="">All moods</option>${MK.map(k=>`<option value="${k}" ${k==fm?'selected':''}>${M[k][0]} ${M[k][1]}</option>`).join('')}</select><select id="so"><option value="new">Newest</option><option value="old" ${so=='old'?'selected':''}>Oldest</option></select><button class="btn p" data-a="plant" data-x="${Math.random()}" data-y="${.4+Math.random()*.5}">+ New entry</button></div>${l.length?l.map(c=>`<div class="card" style="border-left:12px solid ${M[c.m][2]};${c.id==hl?'background:var(--yl);color:#1E1E1E':''}"><div class="row">${mood(c.m)}<span class="mut">${fd(c.t)}</span></div><p>${esc(c.note)||'<i>No note</i>'}</p><div class="row"><button class="btn s" data-a="ed" data-id="${c.id}">Edit</button><button class="btn s" data-a="del" data-id="${c.id}">Delete</button><button class="btn s" data-a="cat" data-id="${c.id}">Details</button><a class="btn s" href="#home" style="text-decoration:none">View in garden</a></div></div>`).join(''):'<div class="card">🌱 No entries yet. Plant your first mood!</div>'}`},
stats(){const l=S.cats.filter(c=>!rg||c.t>Date.now()-rg*D),n=l.length,t=topM(l),cn={};l.forEach(c=>cn[c.m]=(cn[c.m]||0)+1);let a=0;const cg=MK.filter(k=>cn[k]).map(k=>{const s=a;a+=cn[k]/n*100;return`${M[k][2]} ${s}% ${a}%`}).join(',');
const wd=[0,0,0,0,0,0,0];l.forEach(c=>wd[new Date(c.t).getDay()]++);const mx=Math.max(1,...wd);const avg=n?(l.reduce((s,c)=>s+M[c.m][4],0)/n).toFixed(1):'–';const com={happy:22,calm:20,tired:16,anxious:14,excited:10,sad:8,lonely:6,angry:4};
const days=new Set(l.map(c=>dk(c.t))).size;
return`<h1>Vibe Stats 📊</h1><div class="row" style="margin:10px 0">${[[7,'7 days'],[30,'30 days'],[90,'3 months'],[0,'All time']].map(r=>`<button class="btn s ${rg==r[0]?'p':''}" data-a="rng" data-v="${r[0]}">${r[1]}</button>`).join('')}</div><div class="g"><div class="card">Check-ins<h2>${n}</h2></div><div class="card">Top mood<h2>${t?M[t][0]+' '+M[t][1]:'–'}</h2></div><div class="card">Streak<h2>${streak()} 🔥</h2></div><div class="card">Avg mood (1–5)<h2>${avg}</h2></div></div>
<div class="card"><h3>Insights</h3><p>${t?`<a href="#" data-a="stat" data-m="${t}">${M[t][1]} was your most recorded mood in this period →</a>`:'Plant a cat to see insights.'}</p><p>You checked in on ${days} day${days==1?'':'s'} in this period.</p></div>
<div class="g"><div class="card"><h3>Mood distribution</h3><div class="dn" style="background:${n?`conic-gradient(${cg})`:'var(--bg)'}"></div><div class="row" style="margin-top:8px">${Object.keys(cn).map(mood).join('')}</div></div><div class="card"><h3>By weekday</h3><div class="row" style="align-items:flex-end;height:120px;flex-wrap:nowrap">${wd.map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:${v/mx*90}px;background:var(--lv);border:2px solid #1E1E1E;border-radius:6px 6px 0 0"></div>${'SMTWTFS'[i]}</div>`).join('')}</div></div></div>
<div class="card"><h3>Mood calendar (28 days)</h3><div class="cal">${Array.from({length:28},(_,i)=>{const d=dk(Date.now()-(27-i)*D),c=S.cats.filter(x=>dk(x.t)==d).pop();return`<i style="background:${c?M[c.m][2]:'transparent'}" title="${d}">${c?M[c.m][0]:''}</i>`}).join('')}</div></div>
<div class="card"><h3>Community comparison</h3><p class="mut">Aggregated community data — no individual entries shown.</p>${MK.map(k=>`<div class="row" style="flex-wrap:nowrap">${M[k][0]}<div style="flex:1">${bar(com[k],40)}${bar(n?(cn[k]||0)/n*100:0,40)}</div><span class="mut">${com[k]}% / ${n?Math.round((cn[k]||0)/n*100):0}%</span></div>`).join('')}<p class="mut">Top bar: community · bottom bar: you</p></div>`},
wall(){let l=[...S.posts];if(wf=='top')l.sort((a,b)=>Object.values(b.c).reduce((x,y)=>x+y)-Object.values(a.c).reduce((x,y)=>x+y));else if(wf!='recent')l=l.filter(p=>p.m==wf);else l.sort((a,b)=>b.t-a.t);
return`<h1>Vibe Wall 💬</h1><div class="card"><div class="row"><select id="pm">${MK.map(k=>`<option value="${k}">${M[k][0]} ${M[k][1]}</option>`).join('')}</select><select id="pp">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n==3?'selected':''}>${'🐾'.repeat(n)}</option>`).join('')}</select></div><textarea id="pt" rows="2" style="margin:8px 0" placeholder="Share how you feel…"></textarea><button class="btn p" data-a="post">Post</button></div><div class="row" style="margin-bottom:12px"><select id="wf"><option value="recent">Recent</option><option value="top" ${wf=='top'?'selected':''}>Most supported</option>${MK.map(k=>`<option value="${k}" ${wf==k?'selected':''}>${M[k][0]} ${M[k][1]}</option>`).join('')}</select></div>${l.length?l.map(p=>`<div class="card"><div class="row"><span style="font-size:28px">${p.av}</span><b>${esc(p.u)}</b>${mood(p.m)}<span>${'🐾'.repeat(p.p)}</span><span class="mut">${fd(p.t)}</span></div><p>${esc(p.tx)}</p><div class="row">${Object.keys(R).map(k=>`<button class="btn s ${S.mine[p.id]==k?'p':''}" data-a="react" data-id="${p.id}" data-k="${k}">${R[k]} ${p.c[k]}</button>`).join('')}<button class="btn s" data-a="rep">Report</button></div></div>`).join(''):'<div class="card">No posts for this filter yet.</div>'}`},
ach(){return`<h1>Achievements 🏆</h1><p class="mut">Gentle milestones — not a competition.</p><div class="g">${ach().map((a,i)=>{const u=a[2]>=a[3];return`<div class="card ${u?'':'lock'}" style="cursor:pointer;background:${u?'var(--yl);color:#1E1E1E':'var(--sf)'}" data-a="ach" data-i="${i}"><h3>${u?'🏆':'🔒'} ${a[0]}</h3><p class="mut">${a[1]}</p>${bar(a[2],a[3])}<small>${Math.min(a[2],a[3])}/${a[3]}</small></div>`}).join('')}</div>`},
custom(){const c=S.cats.length,s=streak();return`<h1>Customize Garden 🎨</h1><p class="mut">Unlock items by growing your garden. Equipped items appear on Home.</p><div class="row" style="margin:10px 0"><button class="btn" data-a="night">${S.night?'☀️ Day sky':'🌙 Night sky'}</button></div><div class="g">${IT.map(i=>{const u=(i[2]=='cats'?c:s)>=i[3],e=S.eq.includes(i[0]);return`<div class="card ${u?'':'lock'}"><div style="font-size:40px">${i[0]}</div><b>${i[1]}</b><p class="mut">${u?'Unlocked':'Needs '+i[3]+(i[2]=='cats'?' cats':'-day streak')}</p><button class="btn s ${e?'p':''}" data-a="eq" data-e="${i[0]}">${u?(e?'Unequip':'Equip'):'Locked'}</button></div>`}).join('')}</div>`},
reflect(){const p=PR[new Date().getDate()%4];return`<h1>Daily Reflection ✍️</h1><div class="card"><h2>${p}</h2><input type="hidden" id="rp" value="${p}"><textarea id="rt" rows="6" style="margin:10px 0" placeholder="Take your time…"></textarea><button class="btn p" data-a="refl">Save reflection</button></div><h3>Past reflections</h3>${S.refl.length?S.refl.map(r=>`<div class="card"><b>${esc(r.p)}</b><p>${esc(r.tx)}</p><span class="mut">${fd(r.t)}</span></div>`).join(''):'<p class="mut">None yet.</p>'}`},
profile(){return`<h1>Profile 🐾</h1><div class="card"><div style="font-size:60px">${S.u.av}</div><h2>${esc(S.u.name)}</h2><p class="mut">Joined ${S.u.join} · ${S.cats.length} cats · ${streak()}-day streak · ${S.seen.length} achievements</p><div class="row"><input id="un" value="${esc(S.u.name)}"><select id="ua">${['🐱','😺','😸','😻','🙀'].map(a=>`<option ${a==S.u.av?'selected':''}>${a}</option>`).join('')}</select><button class="btn p" data-a="name">Save</button></div></div>`},
settings(){return`<h1>Settings ⚙️</h1><div class="card"><h3>Appearance</h3><button class="btn s" data-a="night">Garden: ${S.night?'Night':'Day'} (toggle)</button></div><div class="card"><h3>Notifications</h3><button class="btn s" data-a="rem">Reminders: ${S.rem?'On':'Off'}</button></div><div class="card"><h3>Privacy</h3><p>🔒 Diary entries are private by default. Only Vibe Wall posts are shared.</p></div><div class="card"><h3>Account</h3><div class="row"><a class="btn s" href="#profile" style="text-decoration:none">Edit profile</a><button class="btn s" data-a="out">Logout</button><button class="btn s" data-a="acc">Delete account</button></div></div>`}};
const N=[['home','🌷 Home Garden'],['diary','📖 My Diary'],['stats','📊 Vibe Stats'],['wall','💬 Vibe Wall'],['reflect','✍️ Reflection'],['settings','⚙️ Settings']];
const TB=r=>'<div class="row" style="margin-bottom:14px">'+[['settings','⚙️ General'],['profile','🐾 Profile'],['ach','🏆 Achievements'],['custom','🎨 Customize']].map(t=>`<a class="btn s ${t[0]==r?'p':''}" href="#${t[0]}" style="text-decoration:none">${t[1]}</a>`).join('')+'</div>';function R_(){const r=location.hash.slice(1)||'home';$('#nv').innerHTML=`<h2 class="x" style="padding:8px">Mood Garden</h2>`+N.map(n=>`<a href="#${n[0]}" class="${n[0]==r||(n[0]=='settings'&&['ach','custom','profile'].includes(r))?'on':''}">${n[1]}</a>`).join('');document.documentElement.dataset.theme=S.night?'dark':'';$('#mn').innerHTML=(['ach','custom','profile','settings'].includes(r)?TB(r):'')+(V[r]||V.home)();if(r!='diary')hl=null}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=A[el.dataset.a];if(a){if(el.tagName=='A')e.preventDefault();a==A.plant?A.plant({x:+el.dataset.x,y:+el.dataset.y}):a(el.dataset,e)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;R_();const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}});
document.addEventListener('change',e=>{if(e.target.id=='fm'){fm=e.target.value;R_()}if(e.target.id=='so'){so=e.target.value;R_()}if(e.target.id=='wf'){wf=e.target.value;R_()}});
addEventListener('hashchange',R_);R_();chk();
</script></body></html>
